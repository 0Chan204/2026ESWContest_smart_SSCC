# mosquitto.conf — 맥북(임시 서버)에서 MQTT 브로커를 실행할 때 쓰는 설정
#
# mosquitto 2.x 는 기본값이 '이 컴퓨터 안에서만 접속 허용'이라서,
# 그대로 켜면 Pi 3대가 접속하지 못한다. 아래 두 줄로 같은 네트워크의 접속을 허용한다.
#
# 실행:  mosquitto -c mosquitto.conf -v
#   (-v = 누가 접속/구독/발행하는지 화면에 표시. 잘 되면 빼도 됨)

# 모든 네트워크 주소의 1883 포트에서 접속 받기
listener 1883 0.0.0.0

# 아이디/비밀번호 없이 접속 허용 (집 안 테스트용. 통합 서버에서는 계정 설정 권장)
allow_anonymous true
