services:
  homevis:
    image: homevis-ai:arm64
    platform: linux/arm64
    build:
      context: .
    # Runtime secrets are injected here, never passed as build arguments.
    env_file: .env
    environment:
      HOMEVIS_DATA_DIR: /data
      TZ: Asia/Seoul
    # Linux board: localhost refers to its existing backend and MQTT broker.
    network_mode: host
    volumes:
      - homevis-data:/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homevis-data:
