# HomeVIS 연결 정보·판단 기준 통합 설정
# 이 파일 수정 → python -m src.integration --check-config → 실행 중인 프로그램 재시작
# 시간은 별도 표기가 없으면 초, 신뢰도/가중치는 0~1입니다.
# 백엔드·MQTT 주소/수신 토픽은 아래에서 설정합니다. 실행 중 변경은 재시작해야 적용됩니다.
# 연결 정보 우선순위: CLI(지원 항목) > OS 환경변수 > .env > 이 파일의 기본값.
# .env는 실행 디렉터리에서 읽습니다. 다른 경로는 --env-file로 지정합니다.
# 가중치 합은 시나리오마다 1.0이어야 합니다. 잘못된 값/오타는 시작 시 거부합니다.
# 가중치 또는 가중치 상·하한 변경 시 별도 학습 파일을 사용합니다.
# 기존 학습 파일은 보존하며, 같은 설정으로 재시작하면 해당 설정의 학습값을 이어 씁니다.
# 시간값을 키우면 해당 확인/유지 기간이 길어집니다. 만료 시간은 클수록 오래된 데이터를 허용합니다.
# 신뢰도 하한·실행 점수는 클수록 실행 조건이 엄격해집니다.
# 가중치는 클수록 해당 근거를 점수에 더 많이 반영합니다. 실제 제어는 별도 상태 검증도 통과해야 합니다.

[backend]
base_url = "http://localhost:8000" # HOMEVIS_BACKEND_URL; 원격 보드이면 http://<보드 IP>:8000. /api/v1은 붙이지 않음
http_timeout = 3.0 # 백엔드 HTTP 요청 제한 시간(초)
poll_interval = 1.0 # 백엔드 기기 상태 조회 간격(초); 센싱 조회 간격은 homevis.toml의 runtime 설정
# 인증은 .env/OS의 HOMEVIS_BACKEND_TOKEN으로만 설정합니다. TOML에 토큰을 넣지 않습니다.

[mqtt]
host = "localhost" # HOMEVIS_MQTT_HOST; 브로커 IP/호스트명만 입력. mqtt:// 또는 포트는 붙이지 않음
port = 1883 # HOMEVIS_MQTT_PORT; 브로커 포트 (TLS 사용 시 서버에 설정된 TLS 포트 지정)
client_id = "homevis-ai" # HOMEVIS_MQTT_CLIENT_ID; 고정 ID, 같은 ID로 여러 AI 프로세스를 실행하지 않음
tls = false # HOMEVIS_MQTT_TLS=true/false; 브로커 TLS 설정과 맞춤
ca_file = "" # HOMEVIS_MQTT_CA_FILE; TLS CA 인증서 경로. 빈 문자열이면 시스템 신뢰 인증서 사용
# 인증은 .env/OS의 HOMEVIS_MQTT_USERNAME, HOMEVIS_MQTT_PASSWORD로만 설정합니다.
# 아래는 AI가 받는 센싱 토픽입니다. 전등 ID(light-00/01/02)를 여기에 넣지 않습니다.
# 전등 매핑: 방(room)=light-01, 화장실(toilet)=light-00, 주방(kitchen)=light-02.
# HomeVIS-Backend develop c92b11a의 device_registry.py/AI-INTEGRATION.md와 대조함.
# AI는 백엔드 기기 상태의 deviceId/room을 따라 HTTP로 제어를 요청합니다. 기기 MQTT 발행은 백엔드 담당입니다.
location_topic = "home/edge/result" # HOMEVIS_LOCATION_TOPIC; sensing_source=mqtt일 때 재실+행동 최종 결과 수신
behavior_topic = "" # HOMEVIS_BEHAVIOR_TOPIC; 합의된 행동 생산자가 있을 때만 설정
fall_status_topic = "" # HOMEVIS_FALL_STATUS_TOPIC; 선택적 낙상 후속 상태 수신
# 음성 토픽은 HOMEVIS_VOICE_TOPIC (기본 home/voice/request), 활성화는 HOMEVIS_VOICE_ENABLED=true.
# 기본 센싱은 백엔드 HTTP입니다. 직접 MQTT 센싱은 HOMEVIS_SENSING_SOURCE=mqtt로 선택합니다.

[llm]
provider = "" # 사용할 LLM: "exaone", "gpt", "qwen", "gemini", "none". ""이면 기존 LLM_PROVIDER 사용
model = ""    # API 모델 ID; qwen이면 로컬 모델 폴더 경로. ""이면 선택한 어댑터의 환경변수/기본값 사용
failure_retry_seconds = 30.0 # LLM 실패 후 같은 provider의 다음 호출을 허용할 간격(초). 외출·안전 판단은 즉시 계속함
# 명시한 provider/model은 환경변수보다 우선합니다. none은 LLM을 끄고 기본 안내문을 사용합니다.
# EXAONE 예: provider = "exaone", model = "LGAI-EXAONE/EXAONE-4.0-32B"
# GPT: provider = "gpt", model에는 계정에서 사용 가능한 모델 ID 지정(또는 OPENAI_MODEL 사용)
# Qwen 예: provider = "qwen", model = "C:/models/Qwen3-8B" (이미 설치된 로컬 모델)
# Qwen 선택 시 같은 Python에 requirements-qwen.txt를 설치해야 합니다. 모델은 자동 다운로드하지 않습니다.
# Gemini: provider = "gemini", model = ""이면 GEMINI_MODEL 또는 기존 어댑터의 기본 모델 사용
# API 키/인증은 .env의 FRIENDLI_API_KEY, OPENAI_API_KEY, Google Cloud 설정에서 읽습니다.
# llama는 아직 구현되지 않아 선택할 수 없습니다. 위 모델 선택은 live 실행의 안내·음성·피드백에 적용됩니다.
# 통합 설정으로 선택한 LLM은 mock에서 자동 호출하지 않습니다. 기기 제어 판단은 LLM 없이도 유지됩니다.

[automation]
automation_profile = "location_level_v1" # 판단 입력 구성: 현재 위치+인덕션 단계; legacy는 기존 전력·행동 입력 사용
# 주방 이탈/복귀와 전등 재실/부재 판단 시간. 외출 전체 OFF 대기 시간이 아닙니다.
automation_absence_seconds = 40.0 # 주방 이탈 후 화력 감소를 검토할 최소 시간; 시간 점수의 정규화 기준
automation_return_seconds = 5.0  # 주방 복귀 후 기존 화력 복구를 검토할 시간; 재점화 잠금을 해제하지 않음
light_on_seconds = 5.0          # 해당 구역 재실이 이 시간 이상 확인되어야 전등 ON 검토
light_off_seconds = 30.0        # 해당 구역 부재가 이 시간 이상 확인되어야 전등 OFF 검토
stove_reduce_steps = 1  # 화력 감소 단계 수: 1~8

[sensing]
allowed_lateness = 4.0  # 수신 가능한 측정 지연; MQTT join_wait_seconds 이상
device_max_age = 20.0   # 기기 상태 만료 시간
behavior_max_skew = 1.0 # 위치와 행동 관측을 결합할 때 허용하는 시각 차이

[realtime]
sensing_confirm_time = 5.0 # 새 위치를 확정하기 위한 기본 관측 기간; away_all_off에는 적용하지 않음
kitchen_short_absence = 20.0 # 인덕션 ON 중 주방 이탈이 이 시간을 넘으면 주의 단계 검토
kitchen_warning_time = 40.0  # 주방 이탈 경고 기준; 고온·급상승이면 더 높은 위험 단계 가능
kitchen_danger_time = 60.0   # 인덕션 ON 중 장기 주방 이탈을 위험 단계로 판단하는 기준
entrance_confirm_time = 10.0 # 기존 entrance 입력의 현관 체류 확인 시간; 현재 Wi-Fi 방 라벨과는 별도
outside_confirm_time = 10.0  # 기존 위험 판단용; away_all_off에는 적용하지 않음
return_confirm_time = 5.0  # 실시간 판단기의 주방 복귀 확인 시간; automation 복귀 시간과 함께 검사
unknown_timeout = 20.0      # 센싱 만료 시간; empty 확인 대기가 아님
appliance_timeout = 20.0 # 실시간 판단기가 기기 관측을 유효하게 보는 최대 시간
min_confidence = 0.6     # 위치 관측을 유효한 재실 근거로 인정할 최소 신뢰도
high_power_watts = 1800.0 # 실제 전력 관측이 이 값 이상이면 고출력으로 분류(W); 단계에서 전력을 추정하지 않음
high_temperature_c = 200.0 # 고온 분류 및 자동 화력 복구 차단에 사용하는 온도(섭씨)
rising_power_watts_per_second = 100.0 # 실제 전력 증가율이 이 값 이상이면 출력 상승으로 판단(W/초)
rising_temperature_c_per_second = 1.0 # 온도 증가율의 상승 기준(섭씨/초); 복구 판단에도 사용
rapid_temperature_c_per_second = 10.0 # 온도 급상승 위험 기준(섭씨/초); 위 상승 기준보다 커야 함

[scenarios]
# 아침 자동화: 시간대는 utc_offset_hours 기준
morning_start = "06:00" # 기상 패턴 학습 전 자동 출수를 허용하는 시작 시각(포함)
morning_end = "10:00"   # 기상 패턴 학습 전 자동 출수를 허용하는 종료 시각(미포함)
wake_record_start = "03:00" # 기상 패턴 학습용 기록을 수집하는 시간대 시작
wake_record_end = "13:00"   # 기상 패턴 학습용 기록을 수집하는 시간대 종료
utc_offset_hours = 9.0      # 위 시각의 UTC 시차; 한국은 +9
wake_confirm_seconds = 5.0  # 지속 자세 관측 경로에서 기상 후보를 확정하는 기간
kitchen_confirm_seconds = 5.0 # 기상 후 주방 체류를 확인하고 자동 출수를 검토하는 기간
wake_to_kitchen_timeout_seconds = 1800.0 # 기상 후 이 시간 안에 주방에 와야 아침 출수 후보 유지
wake_pattern_min_samples = 3  # 고정 아침 시간 대신 학습한 기상 시간대를 쓰기 위한 최소 기록 수
wake_pattern_history_size = 14 # 기상 시간대 계산에 사용할 최근 기록 수
wake_window_margin_seconds = 1800.0 # 학습한 기상 시간 범위의 앞뒤에 추가하는 여유 시간
morning_water_amount_ml = 120 # 아침 자동 출수 요청량(mL)
max_morning_auto_dispense = 1 # 하루 동안 허용하는 아침 자동 출수 요청 횟수
morning_light_enabled = true # 기상 이벤트에 연동한 전등 켜기 사용 여부
wake_event_min_activity_confidence = 0.9 # get_up 기상 이벤트를 인정할 최소 행동 신뢰도
# 취침 소등: 실제 지속 lying 관측 시간
bedtime_lying_seconds = 600.0 # 방에서 유효한 누움 관측이 이 시간 유지되면 취침 소등 검토
# 낙상: confirm < warning < emergency < long_unresponsive 순서 유지
fall_confirm_seconds = 5.0 # 낙상 의심 이후 지속 관측을 통해 낙상을 확인하는 시간
fall_warning_seconds = 10.0 # 낙상 후 무반응이 이어질 때 경고 단계로 올리는 기준
fall_emergency_seconds = 30.0 # 낙상 후 무반응이 이어질 때 긴급 단계로 올리는 기준
long_unresponsive_seconds = 60.0 # 장기 무반응으로 판단하는 관측 시간 기준
recovery_confirm_seconds = 5.0 # 회복 움직임/자세가 확인된 뒤 회복을 확정하는 기간
toilet_lying_suspicion_enabled = true # 화장실 lie_down 이벤트를 낙상 의심 후보로 사용하는 기능
toilet_lying_min_location_confidence = 0.8 # 해당 낙상 의심 후보에 필요한 화장실 위치 신뢰도 하한
toilet_lying_min_activity_confidence = 0.8 # 해당 낙상 의심 후보에 필요한 누움 행동 신뢰도 하한

[home_automation]
air_purifier_enabled = true # 공기청정기 상태를 받아 자동화에 사용하는 기능
cooking_air_clean_enabled = true # 인덕션 조리에 연동해 공기청정기 ON/OFF를 요청하는 기능
air_purifier_off_on_good_or_normal = true # 조리 종료 후 공기질 good/normal이면 공청기 OFF 검토(소유권 확인 필요)
air_purifier_clean_hold_seconds = 30.0 # 조리 종료 후 양호한 공기질 관측이 유지되어야 하는 시간
away_all_off_enabled = true # 검증된 집 전체 부재에 대한 전체 OFF 시나리오 사용 여부
away_min_confidence = 0.8 # 첫 empty를 집 전체 부재 근거로 인정할 최소 관측 신뢰도
# 집 전체 부재 계약을 실제로 확인한 경우에만 true.
# 확인된 유효 empty는 즉시 판단합니다. 외출 확인 대기 시간 설정은 없습니다.
whole_home_presence_verified = false # 배포 확인: empty가 집 전체 부재라는 생산자 계약을 검증했는지 여부

[voice]
min_stt_confidence = 0.6 # 음성 요청의 음성인식(STT) 결과를 받아들이는 최소 신뢰도
min_intent_confidence = 0.8 # 해석한 사용자 의도를 제어/응답에 사용할 최소 신뢰도
history_seconds = 1800.0 # 음성 질문 설명에 사용할 최근 판단 이력 범위(초)

[confidence]
medium_confidence_threshold = 0.60 # 실행 점수에는 못 미쳐도 추가 근거를 기다리는 중간 점수 기준
feedback_learning_rate = 0.02 # 피드백 1회당 가중치 조정 크기; 클수록 더 크게 학습
feedback_apply_threshold = 0.80 # 자연어 피드백 해석 결과를 실제 가중치 학습에 적용할 신뢰도 하한
feedback_review_threshold = 0.50 # 학습 적용 기준 미만의 피드백을 검토용으로 보관할 신뢰도 하한
min_weight = 0.05 # 설정/학습에서 허용하는 개별 가중치 최솟값
max_weight = 0.50 # 설정/학습에서 허용하는 개별 가중치 최댓값
max_stove_power_watts = 1800.0  # legacy 프로필의 화력 점수 정규화 기준
sensor_history_size = 5 # 센싱 일관성 점수를 계산할 최근 관측 개수

# 실행 기준 점수. 이 값을 넘어도 센싱·기기 상태·복귀 잠금 검사를 통과해야 합니다.
# bathroom_fall_alert는 보조 점수용 예약 항목으로 현재 낙상 실행 판단에는 쓰지 않습니다.
# 실제 낙상 확인 시간과 관측 신뢰도 기준은 [scenarios]에서 조정합니다.
[confidence.thresholds]
kitchen_leave_reduce_power = 0.82 # 주방 이탈 화력 감소의 실행 점수 하한
kitchen_return_restore = 0.80 # 주방 복귀 화력 복구의 실행 점수 하한; 외출 후 재점화 잠금은 유지
light_auto_on = 0.72  # 전등 ON 실행 점수 하한
light_auto_off = 0.78 # 전등 OFF 실행 점수 하한
bathroom_fall_alert = 0.90 # 예약된 낙상 보조 점수 하한; 현재 낙상 실행 조건은 아님

# 현재 운영 프로필: 위치와 실제 인덕션 단계 사용
[confidence.weights.location_level_v1.kitchen_leave_reduce_power]
location = 0.30 # 주방 밖 위치 관측 신뢰도의 반영 비중
duration = 0.30 # 주방 이탈 시간 점수의 반영 비중
stove_level = 0.10 # 실제 인덕션 단계(1~9)를 정규화한 점수의 반영 비중
consistency = 0.20 # 최근 관측들이 현재 위치와 일치하는 정도의 반영 비중
feedback = 0.10 # 이 화력 감소 시나리오에 대한 기존 사용자 피드백 점수의 반영 비중

[confidence.weights.location_level_v1.kitchen_return_restore]
location = 0.30 # 주방 복귀 위치 관측 신뢰도의 반영 비중
return_duration = 0.25 # 주방 복귀 후 체류 시간 점수의 반영 비중
consistency = 0.20 # 최근 주방 위치 관측의 일관성 반영 비중
stove_state = 0.10 # 인덕션이 실제 ON 상태인지에 대한 점수 비중
control_state = 0.10 # HomeVIS가 이전에 화력을 감소시켰는지에 대한 점수 비중
