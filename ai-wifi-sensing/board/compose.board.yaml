# 보드(/mnt/rawopt/homevis-sensing)에서 실행: docker compose -f compose.board.yaml up -d
# 백엔드 mosquitto가 보드의 1883 포트를 열어 두므로 host 네트워크로 127.0.0.1에 붙습니다.
# 실행 옵션은 아래 command에서 바꾸면 이미지를 다시 만들 필요 없이 up -d만 하면 됩니다.
services:
  sensing:
    image: homevis-sensing:arm64
    container_name: homevis-sensing
    restart: unless-stopped
    network_mode: host
    security_opt: ["apparmor=unconfined"]
    command:
      - python
      - occupancy_server.py
      - --broker
      - 127.0.0.1
      - --model
      - multizone_occupancy_svm.pkl
      - --behavior-model
      - behavior_svm.pkl
      - --combined-topic
      - home/edge/combined
      - --result-topic
      - home/edge/result
      - --log-dir
      - /app/logs
      # 재실: 수신 속도가 25Hz × 이 값보다 낮으면 poor_signal (기본 0.7 = 17.5Hz, 0.5 = 12.5Hz)
      - --min-rate-ratio
      - "0.5"
    volumes:
      - ./logs:/app/logs
