# CI: develop / main 으로 들어오는 PR마다 테스트를 자동 실행합니다.
# 테스트가 실패하면 PR 화면에 빨간 X가 표시됩니다.
name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트 실행
        run: pytest -v
