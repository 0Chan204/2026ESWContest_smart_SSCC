# 백엔드 Docker 이미지를 빌드해서 GitHub 이미지 저장소(GHCR)에 올립니다.
#
# - develop 에 머지(push)되면 자동 실행, Actions 탭에서 수동 실행도 가능
# - 라즈베리파이 4·5 / M 시리즈 맥(arm64)과 일반 노트북·서버(amd64)용을 한 번에 빌드
# - 올라가는 이미지: ghcr.io/2026esec-sscc/homevis-backend
#     :develop      항상 develop 최신
#     :sha-xxxxxxx  커밋별 고정 버전 (문제가 생기면 이 태그로 되돌림)
#
# 별도 Secret은 필요 없습니다. (GITHUB_TOKEN 사용)
name: Docker Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/2026esec-sscc/homevis-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트 실행
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 이미지를 x86 러너에서 빌드하기 위한 에뮬레이터
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 정하기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: 빌드 및 업로드 (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
