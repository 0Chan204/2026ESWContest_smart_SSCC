# 라즈베리파이 5 (LG ATLAS OS) 보드 전용 덧씌우기 설정입니다.
#
# ATLAS 커널이 Docker 기본 AppArmor 프로필(docker-default)을 받아들이지 못해서,
# 컨테이너마다 Docker 기본 프로필만 끕니다 (OS 자체의 AppArmor 설정은 그대로).
# 보드에는 소스가 없으므로 빌드하지 않고, 맥에서 만들어 옮긴 이미지(IMAGE_TAG=board)를 씁니다.
#
# 보드에서 실행:
#   docker compose -f docker-compose.yml -f docker-compose.board.yml up -d
# 보드 .env 예:
#   IMAGE_TAG=board
#   MONGO_IMAGE=mongo:7        (파이 5는 MongoDB 5.0 이상 실행 가능)
#   OPENAI_API_KEY=...         (보드 마이크 음성 인식 · 스피커 안내, v0.9)
#   VOICE_MIC_DEVICE=alsa_input.usb-0c76_USB_Audio_Device-00.mono-fallback
#
# 보드 모니터 화면은 브라우저가 없어 Flutter 앱(프론트 board-app, ipk)으로 띄웁니다.
# 아래 frontend(nginx)는 같은 Wi-Fi의 맥·폰 브라우저용 React 대시보드입니다.
#
# 보드 폴더(/mnt/rawopt/homevis) 구성:
#   docker-compose.yml, docker-compose.board.yml, .env, mosquitto/mosquitto.conf,
#   nginx.conf (deploy/board/nginx.conf), frontend/ (프론트 빌드 결과 dist 안의 파일)

services:
  mongo:
    security_opt: ["apparmor=unconfined"]
  mosquitto:
    security_opt: ["apparmor=unconfined"]
  backend:
    build: !reset null
    security_opt: ["apparmor=unconfined"]
    # v0.9: 보드 마이크 녹음 · 스피커 안내 (보드의 pulseaudio에 소켓으로 연결)
    # 보드 .env에 OPENAI_API_KEY와 VOICE_MIC_DEVICE(pactl list short sources)를 넣습니다.
    environment:
      PULSE_SERVER: unix:/run/pulse/native
    volumes:
      - /run/pulse/native:/run/pulse/native
  simulator:
    security_opt: ["apparmor=unconfined"]
  home-simulator:
    security_opt: ["apparmor=unconfined"]
  edge-simulator:
    security_opt: ["apparmor=unconfined"]
  fusion-simulator:
    security_opt: ["apparmor=unconfined"]
  voice-ai-simulator:
    security_opt: ["apparmor=unconfined"]

  # 대시보드 화면 (프론트 빌드 결과를 ./frontend 폴더에 넣고 nginx로 서빙)
  # 같은 Wi-Fi의 맥·폰 브라우저에서 http://<보드 IP> 로 접속
  frontend:
    image: nginx:1.27-alpine
    container_name: homevis-frontend
    restart: unless-stopped
    security_opt: ["apparmor=unconfined"]
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
